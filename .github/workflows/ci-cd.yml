name: Enterprise AWS CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image (validation only)
        run: docker build -t devops-ec2-hello-world:ci .

  publish-and-deploy:
    name: Publish to ECR and deploy with SSM
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      AWS_ACCOUNT_ID: "632843870789"
      ECR_REPOSITORY: devops-ec2-hello-world
      APP_NAME: devops-ec2-project
      IMAGE_PARAMETER: /devops-ec2-project/image-uri
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}

      - name: Authenticate Docker to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_TAG_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build --pull -t "$IMAGE_TAG_URI" .
          docker push "$IMAGE_TAG_URI"
          DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' --output text)"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE_URI}"

      - name: Read previous image for rollback
        id: previous
        shell: bash
        run: |
          OLD_IMAGE_URI="$(aws ssm get-parameter --name "$IMAGE_PARAMETER" \
            --query 'Parameter.Value' --output text 2>/dev/null || true)"
          echo "image_uri=${OLD_IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Set desired image in Parameter Store
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          aws ssm put-parameter \
            --name "$IMAGE_PARAMETER" \
            --type String \
            --value "$IMAGE_URI" \
            --overwrite >/dev/null

      - name: Deploy sequentially to EC2 instances through SSM
        id: deploy
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          OLD_IMAGE_URI: ${{ steps.previous.outputs.image_uri }}
        run: |
          set -euo pipefail

          mapfile -t INSTANCE_IDS < <(aws ec2 describe-instances \
            --filters \
              "Name=tag:Application,Values=${APP_NAME}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text | tr '\t' '\n' | sed '/^$/d')

          if [[ ${#INSTANCE_IDS[@]} -lt 2 ]]; then
            echo "Expected at least two running application instances; found ${#INSTANCE_IDS[@]}" >&2
            exit 1
          fi

          run_on_instance() {
            local instance_id="$1"
            local command_id status attempt
            command_id="$(aws ssm send-command \
              --instance-ids "$instance_id" \
              --document-name AWS-RunShellScript \
              --comment "Deploy ${GITHUB_SHA:0:12}" \
              --parameters '{"commands":["sudo /usr/local/bin/deploy-app"]}' \
              --timeout-seconds 900 \
              --query 'Command.CommandId' --output text)"
            if [[ -z "$command_id" || "$command_id" == "None" ]]; then
              echo "SSM returned no command ID for ${instance_id}" >&2
              return 1
            fi
            echo "SSM command ${command_id} on ${instance_id}"
            status="Pending"
            for attempt in $(seq 1 180); do
              status="$(aws ssm get-command-invocation \
                --command-id "$command_id" --instance-id "$instance_id" \
                --query Status --output text 2>/dev/null || echo Pending)"
              case "$status" in
                Success) return 0 ;;
                Failed|TimedOut|Cancelled|Undeliverable|Terminated)
                  aws ssm get-command-invocation --command-id "$command_id" \
                    --instance-id "$instance_id" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json || true
                  return 1 ;;
                *) sleep 5 ;;
              esac
            done
            echo "Timed out waiting for ${instance_id}; status=${status}" >&2
            return 1
          }

          rollback_all() {
            if [[ -z "${OLD_IMAGE_URI}" ]]; then
              echo "No previous image recorded; cannot automatically roll back." >&2
              return 1
            fi
            echo "Rolling back to ${OLD_IMAGE_URI}"
            aws ssm put-parameter --name "$IMAGE_PARAMETER" --type String \
              --value "$OLD_IMAGE_URI" --overwrite >/dev/null
            local failed=0 id
            for id in "${INSTANCE_IDS[@]}"; do
              run_on_instance "$id" || failed=1
            done
            return "$failed"
          }

          for INSTANCE_ID in "${INSTANCE_IDS[@]}"; do
            echo "Deploying to ${INSTANCE_ID}"
            if ! run_on_instance "$INSTANCE_ID"; then
              echo "Deployment failed on ${INSTANCE_ID}; starting rollback." >&2
              rollback_all || echo "Rollback also reported a failure; inspect SSM command output." >&2
              exit 1
            fi
          done

      - name: Verify ALB targets and roll back if unhealthy
        shell: bash
        env:
          OLD_IMAGE_URI: ${{ steps.previous.outputs.image_uri }}
        run: |
          set -euo pipefail
          TG_ARN="$(aws elbv2 describe-target-groups \
            --names "${APP_NAME}-tg" \
            --query 'TargetGroups[0].TargetGroupArn' --output text)"
          for attempt in $(seq 1 36); do
            HEALTHY="$(aws elbv2 describe-target-health --target-group-arn "$TG_ARN" \
              --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" --output text)"
            if [[ "$HEALTHY" -ge 2 ]]; then
              echo "${HEALTHY} targets healthy. Deployment verified."
              exit 0
            fi
            echo "Waiting for at least two healthy targets; currently ${HEALTHY}."
            sleep 10
          done

          echo "ALB target validation failed; restoring previous image." >&2
          if [[ -z "${OLD_IMAGE_URI}" ]]; then
            echo "No previous image is recorded. Manual recovery is required." >&2
            exit 1
          fi
          aws ssm put-parameter --name "$IMAGE_PARAMETER" --type String \
            --value "$OLD_IMAGE_URI" --overwrite >/dev/null
          mapfile -t INSTANCE_IDS < <(aws ec2 describe-instances \
            --filters "Name=tag:Application,Values=${APP_NAME}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text | tr '\t' '\n' | sed '/^$/d')
          for INSTANCE_ID in "${INSTANCE_IDS[@]}"; do
            COMMAND_ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters '{"commands":["sudo /usr/local/bin/deploy-app"]}' \
              --query 'Command.CommandId' --output text)"
            STATUS="Pending"
            for attempt in $(seq 1 180); do
              STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
              case "$STATUS" in
                Success) break ;;
                Failed|TimedOut|Cancelled|Undeliverable|Terminated) break ;;
                *) sleep 5 ;;
              esac
            done
            if [[ "$STATUS" != "Success" ]]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json || true
              echo "Rollback failed on ${INSTANCE_ID}." >&2
              exit 1
            fi
          done
          exit 1
